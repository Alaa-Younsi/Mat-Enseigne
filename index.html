<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mat Enseigne — Enseignes, adhésifs &amp; marquage véhicules à Paris</title>
    <meta
      name="description"
      content="Mat Enseigne conçoit, fabrique et pose vos enseignes à Paris et en Île-de-France : enseignes lumineuses, lettres en relief, enseignes drapeau, adhésifs vitrine, film dépoli et marquage de véhicules. Devis gratuit."
    />
    <meta name="theme-color" content="#140619" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload the LCP image -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/paris-storefront-1600.webp"
      imagesrcset="/images/paris-storefront-800.webp 800w, /images/paris-storefront-1600.webp 1600w"
      imagesizes="(min-width: 1024px) 38vw, 86vw"
      fetchpriority="high"
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Mat Enseigne" />
    <meta property="og:title" content="Mat Enseigne — Des enseignes qui allument votre façade" />
    <meta
      property="og:description"
      content="Boostez votre visibilité avec une façade impactante. Enseignes, adhésifs et marquage véhicules à Paris."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mat Enseigne — enseignes à Paris" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mat Enseigne — Des enseignes qui allument votre façade" />
    <meta
      name="twitter:description"
      content="Enseignes lumineuses, adhésifs vitrine, film dépoli et marquage véhicules à Paris."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "%SITE_URL%/#business",
        "name": "Mat Enseigne",
        "description": "Conception, fabrication et pose d'enseignes, adhésifs vitrine, film dépoli et marquage de véhicules à Paris et en Île-de-France.",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og-image.jpg",
        "telephone": "+33605894411",
        "areaServed": [
          { "@type": "City", "name": "Paris" },
          { "@type": "AdministrativeArea", "name": "Île-de-France" }
        ],
        "address": { "@type": "PostalAddress", "addressLocality": "Paris", "addressCountry": "FR" },
        "sameAs": ["https://www.instagram.com/mat.enseigne/"],
        "priceRange": "€€",
        "knowsAbout": [
          "Enseignes lumineuses",
          "Lettres en relief",
          "Enseignes drapeau",
          "Adhésifs vitrine",
          "Film dépoli",
          "Marquage véhicules"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; color: #f6ebd6; background: #140619">
        Mat Enseigne — Enseignes, adhésifs &amp; marquage véhicules à Paris. Contact : 06 05 89 44 11
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
